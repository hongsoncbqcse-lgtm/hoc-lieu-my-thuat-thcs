<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mỹ thuật 6 - Học liệu Mỹ thuật THCS | Hồng Sơn Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F9F6F0;
            --primary-navy: #162B38;
            --accent-terracotta: #C85A32;
            --accent-ochre: #D9A05B;
            --grade6-accent: #E07A5F;
            --text-dark: #22252A;
            --text-muted: #5A626A;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            font-family: 'Be Vietnam Pro', sans-serif;
            line-height: 1.65;
            background-image: radial-gradient(#dcd6c8 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, #162B38 0%, #1F3C4D 100%);
            color: #FFFFFF;
            text-align: center;
            padding: 45px 20px 40px;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #E07A5F, #F2CC8F);
        }

        .brand-badge {
            display: inline-block;
            color: var(--accent-ochre);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 4.5vw, 40px);
            font-weight: 700;
            margin-bottom: 8px;
        }

        header .subtitle {
            font-size: 14px;
            color: #E2D9C8;
            max-width: 680px;
            margin: 0 auto;
        }

        /* --- THANH ĐIỀU HƯỚNG --- */
        nav {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(22, 43, 56, 0.08);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .nav-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-terracotta);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(200, 90, 50, 0.08);
            transition: all 0.2s;
        }

        .back-home:hover {
            background: var(--accent-terracotta);
            color: #FFFFFF;
        }

        .grade-switcher a {
            color: var(--primary-navy);
            text-decoration: none;
            margin-left: 16px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .grade-switcher a.active {
            background-color: var(--primary-navy);
            color: #FFFFFF;
        }

        .grade-switcher a:hover:not(.active) {
            color: var(--accent-terracotta);
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 1080px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* --- KHUNG TỔNG QUAN & CHỌN NHANH HỌC KỲ --- */
        .overview-card {
            background: var(--card-bg);
            padding: 28px 34px;
            border-radius: 14px;
            border-left: 5px solid var(--grade6-accent);
            box-shadow: 0 8px 24px rgba(22, 43, 56, 0.04);
            margin-bottom: 35px;
        }

        .overview-card h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .overview-card p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .semester-jump {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .jump-btn {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-navy);
            background: #F2EFE9;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            transition: 0.2s;
        }

        .jump-btn:hover {
            background: var(--grade6-accent);
            color: #FFFFFF;
        }

        /* --- NHÃN HỌC KỲ --- */
        .semester-divider {
            margin: 45px 0 25px;
            padding: 12px 20px;
            background: var(--primary-navy);
            color: #FFFFFF;
            border-radius: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .semester-divider span {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 12px;
            color: var(--accent-ochre);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
